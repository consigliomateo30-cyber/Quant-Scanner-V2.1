[project]
name = "quant-scanner"
version = "10.1.0"
description = "Motor cuantitativo de señales de swing, investigación de estrategias y alertas por cliente"
requires-python = ">=3.11"
readme = "README.md"

[project.scripts]
quant-scanner = "quant_scanner.run_daily:main"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "E701", "E702", "E731", "B008", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
